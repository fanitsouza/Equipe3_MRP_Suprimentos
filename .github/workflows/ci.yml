name: CI/CD Pipeline - Hyperautomation MRP

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint-and-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 Linting (Syntax & Quality)
        run: |
          # Stop on critical Python syntax errors or undefined names
          flake8 src tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning-level checks for complexity and length
          flake8 src tests scripts --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  test-suite:
    name: Unit, Integration & Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Configure Timezone
        run: |
          sudo timedatectl set-timezone America/Manaus || true

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml
        env:
          TZ: America/Manaus
          GRP_USER: aluno
          GRP_PASSWORD: avaliacao2026
          GRP_URL: file://${{ github.workspace }}/Source/web/grp_fake.html

      - name: Upload Test and Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml

  docker-build:
    name: Build, Validate & Publish Docker Container
    runs-on: ubuntu-latest
    needs: test-suite
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Execution
        run: |
          docker compose up --build --exit-code-from mrp-pipeline
        env:
          GRP_USER: aluno
          GRP_PASSWORD: avaliacao2026
          TZ: America/Manaus

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') }}
          tags: ${{ steps.meta.outputs.tags || 'lg-mrp-automation:latest' }}
          labels: ${{ steps.meta.outputs.labels }}


