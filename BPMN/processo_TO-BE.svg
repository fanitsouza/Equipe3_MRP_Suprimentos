<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 980" width="100%" height="100%">
  <defs>
    <style>
      .pool { fill: #f8f9fa; stroke: #0c8599; stroke-width: 2; }
      .lane-hdr { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0c8599; }
      .task-ext { fill: #d0ebff; stroke: #1971c2; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-pan { fill: #d3f9d8; stroke: #2b8a3e; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-mac { fill: #fff3bf; stroke: #e67700; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-hitl { fill: #f3f0ff; stroke: #7950f2; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-alert { fill: #ffe3e3; stroke: #c92a2a; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-rep { fill: #d4edda; stroke: #28a745; stroke-width: 1.5; rx: 8; ry: 8; }
      .task-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .task-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9px; fill: #495057; text-anchor: middle; }
      .gateway { fill: #ffeaa7; stroke: #d39e00; stroke-width: 2; }
      .ev-start { fill: #d4edda; stroke: #28a745; stroke-width: 2.5; }
      .ev-rec { fill: #d1ecf1; stroke: #17a2b8; stroke-width: 2.5; }
      .ev-end { fill: #d4edda; stroke: #28a745; stroke-width: 3; }
      .flow { stroke: #1971c2; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-ok { stroke: #28a745; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .flow-err { stroke: #c92a2a; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
      .gw-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #212529; text-anchor: middle; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1971c2" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#28a745" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c92a2a" />
    </marker>
  </defs>

  <!-- Pool Header -->
  <rect x="20" y="20" width="1520" height="920" class="pool" />
  <rect x="20" y="20" width="45" height="920" fill="#0c8599" />
  <text x="-480" y="50" transform="rotate(-90)" fill="#ffffff" font-family="'Segoe UI', Arial" font-size="14" font-weight="bold" text-anchor="middle">LG Electronics — Solução de Hyperautomation para o MRP em Suprimentos (TO-BE)</text>

  <!-- Lane 1: Gatilhos -->
  <rect x="65" y="20" width="1475" height="150" fill="#e3fafc" stroke="#1098ad" />
  <text x="75" y="95" class="lane-hdr">GATILHOS TEMPORAIS (Orquestrador RPA)</text>

  <!-- Lane 2: Fase 1 Extracao -->
  <rect x="65" y="170" width="1475" height="170" fill="#ffffff" stroke="#adb5bd" />
  <text x="75" y="255" class="lane-hdr">FASE 1: EXTRAÇÃO DE DADOS (Playwright, BotCity &amp; Mail Monitor)</text>

  <!-- Lane 3: Fase 2 e 3 Tratamento -->
  <rect x="65" y="340" width="1475" height="200" fill="#ebfbee" stroke="#40c057" />
  <text x="75" y="440" class="lane-hdr">FASE 2 &amp; 3: TRATAMENTO &amp; INJEÇÃO (Python / Pandas &amp; openpyxl)</text>

  <!-- Lane 4: Fase 4 e 5 Macros e Validacao -->
  <rect x="65" y="540" width="1475" height="200" fill="#fff9db" stroke="#f59f00" />
  <text x="75" y="640" class="lane-hdr">FASE 4 &amp; 5: MACROS &amp; VALIDAÇÃO (VBA Engine &amp; Data Checker)</text>

  <!-- Lane 5: Fase 6 HITL -->
  <rect x="65" y="740" width="1475" height="200" fill="#f3f0ff" stroke="#7950f2" />
  <text x="75" y="840" class="lane-hdr">FASE 6: HUMAN-IN-THE-LOOP (Felipe Campelo &amp; Analistas de Compras)</text>

  <!-- Elements -->
  <!-- Start Event Main -->
  <circle cx="120" cy="85" r="22" class="ev-start" />
  <text x="120" y="122" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#155724" text-anchor="middle">Gatilho Diário</text>
  <text x="120" y="134" font-family="'Segoe UI', Arial" font-size="8" fill="#155724" text-anchor="middle">07:30h da manhã</text>

  <!-- Start Event Recurrent -->
  <circle cx="210" cy="85" r="22" class="ev-rec" />
  <text x="210" y="122" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#0c5460" text-anchor="middle">Gatilho Recorrente</text>
  <text x="210" y="134" font-family="'Segoe UI', Arial" font-size="8" fill="#0c5460" text-anchor="middle">A cada 20 min</text>

  <!-- Task: Playwright GERP -->
  <rect x="290" y="215" width="145" height="75" class="task-ext" />
  <text x="362" y="235" class="task-title">Bot Web Playwright</text>
  <text x="362" y="250" class="task-desc">Login automático GERP,</text>
  <text x="362" y="263" class="task-desc">download da BOM e</text>
  <text x="362" y="276" class="task-desc">Delivery Status</text>

  <!-- Task: Mail & File Monitor -->
  <rect x="470" y="215" width="150" height="75" class="task-ext" />
  <text x="545" y="235" class="task-title">Mail &amp; File Monitor</text>
  <text x="545" y="250" class="task-desc">Captura estoques fornecedores,</text>
  <text x="545" y="263" class="task-desc">lê N-FP e Saldo Onhand</text>
  <text x="545" y="276" class="task-desc">nos repositórios</text>

  <!-- Task: Pandas Processing -->
  <rect x="650" y="380" width="240" height="110" class="task-pan" />
  <text x="770" y="402" class="task-title">Processamento Python / Pandas</text>
  <text x="770" y="420" class="task-desc">• N-FP: Recorte D+13 dias até sábado</text>
  <text x="770" y="435" class="task-desc">• Expurgo automático domingos/feriados</text>
  <text x="770" y="450" class="task-desc">• Segmentação de 8 semanas e mensal</text>
  <text x="770" y="465" class="task-desc">• Delivery: Exclusão vetorial colunas C a AV</text>
  <text x="770" y="480" class="task-desc">• Onhand: Cópia e validação estrutural</text>

  <!-- Task: Excel Injection -->
  <rect x="920" y="395" width="165" height="80" class="task-pan" />
  <text x="1002" y="418" class="task-title">Injeção Master All</text>
  <text x="1002" y="433" class="task-desc">Alimenta a partir da 2ª célula</text>
  <text x="1002" y="446" class="task-desc">na PlanPPH, injeta Delivery e</text>
  <text x="1002" y="459" class="task-desc">preserva fórmulas fixas A e B</text>

  <!-- Gateway: BOM check -->
  <polygon points="1125,640 1155,610 1185,640 1155,670" class="gateway" />
  <text x="1155" y="597" class="gw-label">Há nova BOM</text>
  <text x="1155" y="607" class="gw-label">no GERP hoje?</text>

  <!-- Task: Macro Seq 1 -->
  <rect x="1225" y="565" width="165" height="65" class="task-mac" />
  <text x="1307" y="585" class="task-title">Sequência Com BOM</text>
  <text x="1307" y="600" class="task-desc">1º Update BOM &gt; 2º Summary</text>
  <text x="1307" y="613" class="task-desc">3º Update Onhand &gt; 4º Plan</text>

  <!-- Task: Macro Seq 2 -->
  <rect x="1225" y="655" width="165" height="60" class="task-mac" />
  <text x="1307" y="675" class="task-title">Sequência Sem BOM</text>
  <text x="1307" y="690" class="task-desc">1º Update Onhand</text>
  <text x="1307" y="703" class="task-desc">2º Update Plan</text>

  <!-- Gateway: Integrity -->
  <polygon points="1425,640 1455,610 1485,640 1455,670" class="gateway" />
  <text x="1455" y="597" class="gw-label">Data BOM ==</text>
  <text x="1455" y="607" class="gw-label">Data Summary?</text>

  <!-- Task: Alert -->
  <rect x="1225" y="770" width="165" height="65" class="task-alert" />
  <text x="1307" y="792" class="task-title">Alerta Crítico Teams/E-mail</text>
  <text x="1307" y="807" class="task-desc">Notifica Felipe Campelo e equipe</text>
  <text x="1307" y="820" class="task-desc">com logs e isola a planilha</text>

  <!-- Task: Auto Reports -->
  <rect x="1410" y="750" width="130" height="70" class="task-rep" />
  <text x="1475" y="770" class="task-title">Geração de Relatórios</text>
  <text x="1475" y="785" class="task-desc">Capacidade por fornecedor</text>
  <text x="1475" y="798" class="task-desc">Diário, Semanal e Mensal</text>
  <text x="1475" y="811" class="task-desc">em Excel e dashboards</text>

  <!-- Task: HITL Decision -->
  <rect x="1410" y="845" width="130" height="65" class="task-hitl" />
  <text x="1475" y="865" class="task-title">Human-in-the-Loop</text>
  <text x="1475" y="880" class="task-desc">Felipe Campelo e analistas:</text>
  <text x="1475" y="893" class="task-desc">Decisões táticas de compras</text>

  <!-- End Event -->
  <circle cx="1307" cy="880" r="22" class="ev-end" />
  <text x="1307" y="918" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#155724" text-anchor="middle">Processo Concluído</text>
  <text x="1307" y="930" font-family="'Segoe UI', Arial" font-size="8" fill="#155724" text-anchor="middle">&lt;5 min | 100% Rastreável</text>

  <!-- Flows -->
  <path d="M 142 85 L 290 85 L 290 215" class="flow" />
  <path d="M 232 85 L 290 85" class="flow" />
  <path d="M 435 252 L 470 252" class="flow" />
  <path d="M 620 252 L 635 252 L 635 435 L 650 435" class="flow" />
  <path d="M 890 435 L 920 435" class="flow" />
  <path d="M 1085 435 L 1105 435 L 1105 640 L 1125 640" class="flow" />
  <path d="M 1155 610 L 1155 597 L 1225 597" class="flow" />
  <path d="M 1155 670 L 1155 685 L 1225 685" class="flow" />
  <path d="M 1390 597 L 1455 597 L 1455 610" class="flow" />
  <path d="M 1390 685 L 1455 685 L 1455 670" class="flow" />
  <path d="M 1455 670 L 1455 750" class="flow-ok" />
  <path d="M 1425 640 L 1307 640 L 1307 770" class="flow-err" />
  <path d="M 1475 820 L 1475 845" class="flow" />
  <path d="M 1410 880 L 1329 880" class="flow" />
</svg>